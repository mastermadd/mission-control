name: Check Mission Control
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: bash -n install.sh mission-control
      - name: Build with restrictive installer permissions
        run: |
          context=$(mktemp -d)
          git archive HEAD | tar -x -C "$context"
          chmod -R go-rwx "$context"
          docker build -t mission-control:test "$context"
      - name: Provision and start the non-root production image
        run: bash tests/container-smoke.sh mission-control:test
